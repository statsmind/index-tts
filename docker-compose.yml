version: '3.8'

services:
  indextts-api:
    build: .
    container_name: indextts-api
    ports:
      - "8000:8000"
      - "7860:7860"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
      - ./prompts:/app/prompts
    environment:
      - PYTHONPATH=/app
    command: uv run api.py --host 0.0.0.0 --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  indextts-webui:
    build: .
    container_name: indextts-webui
    ports:
      - "7860:7860"
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./outputs:/app/outputs
      - ./prompts:/app/prompts
    environment:
      - PYTHONPATH=/app
    command: uv run webui.py --host 0.0.0.0 --port 7860
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]